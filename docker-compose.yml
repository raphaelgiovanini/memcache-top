services:

  # ── Memcached (local, para desenvolvimento/teste) ────────────────
  memcached:
    image: memcached:latest
    ports:
      - "11211:11211"
    command: ["-m", "64"]
    profiles:
      - local

  # ── Terminal monitor (interativo) ─────────────────────────────────
  memcache-top:
    build: .
    command: ["--instances", "${MEMCACHED_HOSTS:-memcached:11211}", "--sleep", "3", "--color"]
    tty: true
    stdin_open: true
    profiles:
      - monitor

  # ── Prometheus exporter ───────────────────────────────────────────
  # Aponta para o memcached remoto via MEMCACHED_HOSTS
  #
  #   MEMCACHED_HOSTS=10.0.1.50:11211 docker compose up memcache-exporter
  #   MEMCACHED_HOSTS=mc1:11211,mc2:11211 docker compose up memcache-exporter
  #
  memcache-exporter:
    build: .
    command: ["--instances", "${MEMCACHED_HOSTS:-127.0.0.1:11211}", "--prometheus", "9150"]
    ports:
      - "${EXPORTER_PORT:-9150}:9150"
    restart: unless-stopped

  # ── Stack completa (Prometheus + Grafana) para quem não tem ──────
  prometheus:
    image: prom/prometheus:latest
    depends_on:
      - memcache-exporter
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    profiles:
      - full-stack

  grafana:
    image: grafana/grafana:latest
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./grafana/dashboard-provider.yml:/etc/grafana/provisioning/dashboards/dashboard-provider.yml:ro
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/memcached.json:ro
    ports:
      - "3000:3000"
    profiles:
      - full-stack
