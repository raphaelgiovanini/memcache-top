services:

  # ── Prometheus exporter ───────────────────────────────────────────
  # Aponta para o memcached remoto via MEMCACHED_HOSTS
  #
  #   MEMCACHED_HOSTS=10.0.1.50:11211 docker compose up -d
  #   MEMCACHED_HOSTS=mc1:11211,mc2:11211 docker compose up -d
  #
  memcache-exporter:
    build: .
    command: ["--instances", "${MEMCACHED_HOSTS:-127.0.0.1:11211}", "--prometheus", "9150"]
    ports:
      - "${EXPORTER_PORT:-9150}:9150"
    restart: unless-stopped
